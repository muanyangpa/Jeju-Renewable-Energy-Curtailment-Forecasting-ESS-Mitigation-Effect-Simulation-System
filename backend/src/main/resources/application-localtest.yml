# 로컬 연동 테스트 프로파일 — PostgreSQL 없이 Backend <-> AI 서버 연동을 확인한다.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=localtest
#
# 기본 프로파일(application.yml)은 건드리지 않는다. 운영/개발은 그대로 PostgreSQL을 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:curtailment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop     # 인메모리라 매 실행 새로 만든다
    show-sql: false             # 24건 저장 로그가 길어서 끈다
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
