spring:
  application:
    name: ami-anomaly-backend

  # DB 연결 정보 - 로컬 개발 시 본인 환경에 맞게 수정
  datasource:
    url: jdbc:postgresql://localhost:5432/ami_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 개발 중엔 update, 배포 시엔 validate 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# Python AI 서버 주소 (내부 통신 전용, 외부 비노출)
ai-server:
  base-url: http://localhost:8000
